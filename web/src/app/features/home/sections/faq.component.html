<section class="faq" id="faq" appReveal>
  <div class="faq__head">
    <div class="eyebrow"><span class="rule"></span> &nbsp; Perguntas frequentes &nbsp; <span class="rule"></span></div>
    <h2>Para qualquer dúvida.</h2>
  </div>
  <div class="faq__list">
    @for (item of items; track item.q; let i = $index) {
      <div class="faq__item" [class.open]="openIndex() === i">
        <button type="button" class="faq__q" (click)="toggle(i)">{{ item.q }}</button>
        <div class="faq__a" [innerHTML]="item.a"></div>
      </div>
    }
  </div>
</section>
