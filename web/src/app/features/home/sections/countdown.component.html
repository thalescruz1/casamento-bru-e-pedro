<section class="tint" id="contagem" appReveal>
  <div class="wrap">
    <div class="section-head">
      <p class="eyebrow">Falta pouco</p>
      <h2>Contagem <em>regressiva</em></h2>
    </div>
    <div class="countdown">
      <div class="cd-tile"><div class="cd-num">{{ tiles().days }}</div><div class="cd-base">Dias</div></div>
      <div class="cd-tile"><div class="cd-num">{{ tiles().hours }}</div><div class="cd-base">Horas</div></div>
      <div class="cd-tile"><div class="cd-num">{{ tiles().minutes }}</div><div class="cd-base">Minutos</div></div>
      <div class="cd-tile"><div class="cd-num">{{ tiles().seconds }}</div><div class="cd-base">Segundos</div></div>
    </div>
  </div>
</section>
