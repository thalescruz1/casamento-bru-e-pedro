name: Deploy — Bruna & Pedro (produção)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bp-prod
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build Angular
        working-directory: web
        run: npx ng build --configuration production

      - name: Publish .NET Functions
        run: dotnet publish src/Api/Casamento.Api.csproj -c Release -o api-publish

      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Deploy to Azure Static Web Apps
        env:
          SWA_TOKEN: ${{ secrets.SWA_BP_DEPLOY_TOKEN }}
        run: |
          swa deploy web/dist/web/browser \
            --api-location api-publish \
            --api-language dotnetisolated --api-version 8.0 \
            --deployment-token "$SWA_TOKEN" \
            --env production
