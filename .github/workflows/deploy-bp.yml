name: Deploy — Bruna & Pedro (produção)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build Angular
        working-directory: web
        run: npx ng build --configuration production

      - name: Publish .NET Functions
        run: dotnet publish src/Api/Casamento.Api.csproj -c Release -o api-publish

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_BP_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'web/dist/web/browser'
          api_location: 'api-publish'
          output_location: ''
          skip_app_build: true
          skip_api_build: true
